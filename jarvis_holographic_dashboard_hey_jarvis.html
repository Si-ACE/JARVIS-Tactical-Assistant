<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Autonomous Tactical Assistant</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --dark-bg: #050b14;
            --panel-bg: rgba(0, 243, 255, 0.05);
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-blue);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--neon-blue);
        }

        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-glow);
            background: var(--panel-bg);
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 15px;
            border-radius: 5px;
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.05);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border-glow);
            padding-bottom: 5px;
        }

        /* Telemetry Meters */
        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        /* Console Logs / Chat Box */
        #console-log {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glow);
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
        }

        .log-entry {
            word-break: break-all;
        }

        .log-jarvis { color: #00f3ff; }
        .log-user { color: #00ff66; }

        /* Controls Section */
        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 12px;
            outline: none;
            border-radius: 3px;
        }

        button {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            border-radius: 3px;
        }

        button:hover {
            background: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border: 1px solid;
            font-size: 0.75rem;
            border-radius: 3px;
        }
        .active { color: #00ff66; border-color: #00ff66; }
        .inactive { color: #ff3333; border-color: #ff3333; }
    </style>
</head>
<body>

    <header>J.A.R.V.I.S. // TACTICAL INTERFACE v4.0</header>

    <div class="main-container">
        <!-- Left Panel: Telemetry & Status -->
        <div class="left-panel">
            <div class="card">
                <h3>System Telemetry</h3>
                <div class="metric-row"><span>CPU Usage:</span> <span id="cpu-val">0%</span></div>
                <div class="metric-row"><span>RAM Usage:</span> <span id="ram-val">0%</span></div>
                <div class="metric-row"><span>GPU Usage:</span> <span id="gpu-val">N/A</span></div>
                <div class="metric-row"><span>GPU Temp:</span> <span id="gpu-temp-val">N/A</span></div>
                <div class="metric-row"><span>CPU Temp:</span> <span id="cpu-temp-val">N/A</span></div>
            </div>

            <div class="card">
                <h3>Protocols & Wake Word</h3>
                <div class="metric-row">
                    <span>Wake Word ("Hey Jarvis"):</span> 
                    <span id="wakeword-status" class="status-badge inactive">DISARMED</span>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button onclick="toggleWakeWord(true)">Arm Wake Word</button>
                    <button onclick="toggleWakeWord(false)">Disarm</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Command Logs & Chat Input -->
        <div class="right-panel">
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <h3>Tactical Feed & Logs</h3>
                <div id="console-log">
                    <div class="log-entry log-jarvis">[JARVIS]: Holographic interface initialized, sir. Awaiting input.</div>
                </div>
            </div>

            <div class="card controls-area">
                <h3>Direct Command Input</h3>
                <div class="input-group">
                    <input type="text" id="chat-input" placeholder="Type a command or query..." onkeydown="checkEnter(event)">
                    <button onclick="sendChat()">Transmit</button>
                    <button id="ptt-btn" onclick="triggerPTT()">Push-to-Talk</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Pywebview API bridge handlers & UI functions
        let wakeArmed = false;

        function updateTelemetry(cpu, ram, gpu, gpuTemp, cpuTemp) {
            document.getElementById('cpu-val').innerText = cpu + '%';
            document.getElementById('ram-val').innerText = ram + '%';
            document.getElementById('gpu-val').innerText = (gpu !== null ? gpu + '%' : 'N/A');
            document.getElementById('gpu-temp-val').innerText = (gpuTemp !== null ? gpuTemp + '°C' : 'N/A');
            document.getElementById('cpu-temp-val').innerText = (cpuTemp !== null ? cpuTemp + '°C' : 'N/A');
        }

        function updateWakeWordStatus(enabled) {
            wakeArmed = enabled;
            const badge = document.getElementById('wakeword-status');
            if (enabled) {
                badge.innerText = "ARMED";
                badge.className = "status-badge active";
            } else {
                badge.innerText = "DISARMED";
                badge.className = "status-badge inactive";
            }
        }

        function toggleWakeWord(enable) {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.set_wake_word_enabled(enable);
            } else {
                updateWakeWordStatus(enable);
            }
        }

        function appendLog(sender, message) {
            const logBox = document.getElementById('console-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${sender === 'JARVIS' ? 'log-jarvis' : 'log-user'}`;
            entry.innerText = `[${sender}]: ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendLog('USER', text);
            input.value = '';

            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.handle_chat_input(text);
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendChat();
            }
        }

        function triggerPTT() {
            const pttBtn = document.getElementById('ptt-btn');
            pttBtn.innerText = "Listening...";
            pttBtn.style.borderColor = "#00ff66";
            
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.trigger_push_to_talk();
            }
        }

        function resetPTTButton() {
            const pttBtn = document.getElementById('ptt-btn');
            pttBtn.innerText = "Push-to-Talk";
            pttBtn.style.borderColor = "var(--neon-blue)";
        }

        function setPTTListeningState() {
            const pttBtn = document.getElementById('ptt-btn');
            pttBtn.innerText = "Listening...";
        }
    </script>
</body>
</html>
